# pnpm 12 reads its settings from this file, not from package.json `pnpm`.
# Both dependencies ship build scripts we want to run: simple-git-hooks installs
# the git hooks, esbuild (via tsx/vitest) validates its platform binary.
# Without this allow-list, `pnpm install` exits non-zero (ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  esbuild: true
  simple-git-hooks: true

# A git worktree borrows the parent checkout's installed dependencies through a
# junction, and pnpm 12's pre-script install refuses to write through it
# ("workspace hoist directory is not a real directory"). Every script in every
# worktree then fails its install first and prints a warning that points at the
# wrong problem — an iteration's fan-out paid that 53 times and each agent
# pasted two `npm_config_*` variables onto every command.
# What the check stands in for — a lockfile that disagrees with the manifest —
# is enforced where it actually runs: the frozen install in CI (#107).
verifyDepsBeforeRun: false
