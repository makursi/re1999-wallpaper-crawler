name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes a running job obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from `packageManager`), a Node.js runtime, and
      # runs `pnpm install`. The runtime must be spelled out: this repository has
      # no `devEngines.runtime` for the action to read, and pnpm's own binary
      # does not bring Node.js with it — every step below needs it on PATH.
      # CI matches local development on Node 24; `engines` only sets the floor.
      #
      # The lockfile is enforced by pnpm itself: under CI it installs frozen, so
      # a lockfile that disagrees with `package.json` fails the job rather than
      # resolving from the registry. There is no action input for that — the
      # `require-lockfile` this file used to carry is not one of pnpm/setup's,
      # and the action warned about it on every run while doing nothing.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # No `.env` is needed: the unit tests cover pure logic (report, gallery,
      # wallpaper URL set, Console service) and never import `core/config.ts`.

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      # The Console's page is this repository's build artifact: the start
      # command builds it, and CI proves it still builds (docs/adr/0011).
      - name: Build web bundle
        run: pnpm build:web

      - name: Test
        run: pnpm test
